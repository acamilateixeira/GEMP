name: Demo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Mesmas verificações do CI: o deploy não publica código que o CI recusaria.
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build the comparison as WebAssembly
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o frontend/public/gemp.wasm ./cmd/gemp-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" frontend/public/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/wasm-smoke.cjs frontend/public/wasm_exec.js frontend/public/gemp.wasm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit && npx vite build --base=/GEMP/
        env:
          VITE_GEMP_WASM: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
