name: GEMP CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - name: WebAssembly build behaves like the API
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/gemp.wasm" ./cmd/gemp-wasm
          node scripts/wasm-smoke.cjs "$(go env GOROOT)/lib/wasm/wasm_exec.js" "$RUNNER_TEMP/gemp.wasm"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
